[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tendril-graph"
version = "0.1.0-alpha"
description = "Cross-repo dependency graph reconstruction for multi-repo estates"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Tendril Contributors" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "fastapi>=0.137.1",
    "kuzu>=0.8.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0",
    "uvicorn>=0.49.0",
]

[project.optional-dependencies]
dev = [
    "tendril-graph[mcp]",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]
llm = [
    "litellm>=1.30",
]
mcp = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
tendril = "tendril.__main__:main_entry"

[project.entry-points."tendril.plugins"]
# Reference plugins register here. Example:
# kuzu = "tendril.store.kuzu_store:KuzuStore"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.hatch.build.targets.wheel]
packages = ["tendril"]
